
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Content Studio</title>
      <meta name="description" content="Streamline your document management with a user-friendly platform that allows users to easily organize, share, and collaborate on files." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="mobile-web-app-capable" content="yes" />
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        /* Mobile Content Studio shell — keep screens from forcing desktop widths */
        html[data-cs-shell="mobile"] .cs-mobile-main > * {
          max-width: 100%;
        }
        html[data-cs-shell="mobile"] .cs-mobile-main {
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
