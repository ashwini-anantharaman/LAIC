
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Content Studio</title>
      <meta name="description" content="Streamline your document management with a user-friendly platform that allows users to easily organize, share, and collaborate on files." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="mobile-web-app-capable" content="yes" />
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        /* Mobile Content Studio shell — keep screens from forcing desktop widths */
        html[data-cs-shell="mobile"] .cs-mobile-main > * {
          max-width: 100%;
        }
        html[data-cs-shell="mobile"] .cs-mobile-main {
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
        }
        /* Embedded viewer (/o/<id>, e.g. the mobile app's WebView). It renders
           before the Content Studio shell, so the mobile guards above never
           reach it — content that overshoots the viewport would scroll the
           whole page sideways with no way to tell what caused it. */
        .cs-embed-root {
          max-width: 100vw;
          overflow-x: hidden;
        }
        .cs-embed-root img,
        .cs-embed-root video,
        .cs-embed-root iframe,
        .cs-embed-root table,
        .cs-embed-root pre {
          max-width: 100%;
        }
        /* Long unbroken strings (URLs, bidding notation) are a common source of
           sideways scroll in authored prose. */
        .cs-embed-root p,
        .cs-embed-root li,
        .cs-embed-root h1,
        .cs-embed-root h2,
        .cs-embed-root h3 {
          overflow-wrap: anywhere;
        }
        .cs-embed-root pre { overflow-x: auto; }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
