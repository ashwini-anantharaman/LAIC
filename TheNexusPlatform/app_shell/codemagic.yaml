# Codemagic build template for a packaged App Shell app.
#
# ⚠️ INERT UNTIL YOU ADD ACCOUNTS + SECRETS. This documents the cloud-macOS
# path (no Mac needed locally). Fill the referenced env groups in the Codemagic
# UI, set BUILD_SLUG to the app you packaged, then enable the workflow.
#
# Prereqs: Apple Developer + Google Play accounts, signing set up in Codemagic,
# and a committed build package expanded via `pnpm package` (or produced in-CI).

workflows:
  appshell-native:
    name: App Shell — native (iOS + Android)
    instance_type: mac_mini_m2 # macOS is required for the iOS build
    environment:
      vars:
        BUILD_SLUG: "brain-bee" # ← the packaged app (build/<slug>/)
      groups:
        - appstore_connect # APP_STORE_CONNECT_* (API key)
        - ios_signing # certificate + provisioning profile (or managed signing)
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - android_keystore # CM_KEYSTORE*, key alias/password
      node: 20
    scripts:
      - name: Install
        script: corepack enable && pnpm install --frozen-lockfile
      - name: Build web
        script: pnpm build
      - name: Assemble Capacitor variant
        script: |
          cp "build/$BUILD_SLUG/capacitor.config.json" ./capacitor.config.json
          mkdir -p www && cp -r dist/* www/
          cp "build/$BUILD_SLUG/published-config.js" www/
          # ensure www/index.html loads published-config.js before the app bundle
          npx cap sync
      - name: Build Android (.aab)
        script: cd android && ./gradlew bundleRelease
      - name: Build iOS (.ipa)
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
    publishing:
      # app_store_connect: { ... submit_to_testflight: true }
      # google_play: { credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, track: internal }
      email:
        recipients:
          - you@example.org
