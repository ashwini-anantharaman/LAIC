# GitHub Actions template for packaged App Shell native builds.
#
# ⚠️ INERT UNTIL YOU ADD ACCOUNTS + SECRETS + fastlane lanes. Manual-trigger
# only. Android builds on Ubuntu; iOS builds on a macOS runner. Add the repo
# secrets listed in docs/native-build.md and a fastlane/Fastfile, then run it.

name: mobile-build
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Packaged app slug (build/<slug>/)"
        required: true
        default: "brain-bee"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assemble Capacitor variant
        run: |
          cp "build/${{ github.event.inputs.slug }}/capacitor.config.json" ./capacitor.config.json
          mkdir -p www && cp -r dist/* www/
          cp "build/${{ github.event.inputs.slug }}/published-config.js" www/
          pnpm add @capacitor/android
          npx cap add android || true
          npx cap sync android
      # - name: Sign & build .aab  (needs ANDROID_KEYSTORE_* secrets)
      #   run: cd android && ./gradlew bundleRelease
      # - name: Upload to Play internal (needs PLAY_SERVICE_ACCOUNT_JSON + fastlane supply)
      #   run: bundle exec fastlane android internal

  ios:
    runs-on: macos-14 # macOS required for iOS
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assemble Capacitor variant
        run: |
          cp "build/${{ github.event.inputs.slug }}/capacitor.config.json" ./capacitor.config.json
          mkdir -p www && cp -r dist/* www/
          cp "build/${{ github.event.inputs.slug }}/published-config.js" www/
          pnpm add @capacitor/ios
          npx cap add ios || true
          npx cap sync ios
      # - name: Signing (fastlane match) — needs APP_STORE_CONNECT_* + MATCH_PASSWORD
      #   run: bundle exec fastlane ios certificates
      # - name: Build & upload to TestFlight — needs signing above
      #   run: bundle exec fastlane ios beta
